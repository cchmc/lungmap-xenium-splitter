[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xenium-splitter"
version = "0.1.0"
description = "Split Xenium outputs by LASSO regions and optionally process matching H&E images."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "xenium-splitter contributors" }
]
dependencies = [
  "numpy>=1.26,<2",
  "opencv-python-headless>=4.8,<4.12",
  "pandas>=2.2",
  "Pillow>=10.0",
  "shapely>=2.0",
  "tifffile>=2024.5.22",
  "imagecodecs>=2024.1.1",
  "typer>=0.12",
]

[project.optional-dependencies]
parquet = ["pyarrow>=15.0"]
svs = ["openslide-python>=1.3.1"]
hdf5 = ["h5py>=3.10"]
zarr = ["zarr<=3.0.0"]
dev = [
  "pytest>=8.0",
  "ruff>=0.6.0",
]

[project.scripts]
xenium-splitter = "xenium_splitter.cli:app"
xenium-recalc-diffexp = "xenium_splitter.recalculate_diffexp:app"
xenium-validate-transcripts-zarr = "xenium_splitter.validate_transcripts_zarr:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
